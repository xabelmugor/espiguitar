<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Espinete">
<meta name="theme-color" content="#14161b">
<title>Espinete · Práctica de guitarra</title>
<style>
:root{--bg:#14161b;--card:#1e222a;--card2:#272c36;--line:#363c48;--txt:#eef0f3;--mut:#9aa3b2;--acc:#f5b324;--acc2:#ffd76a;--red:#e5484d;--ok:#3fb950;--bad:#f85149;--fb:#fff3a3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:18px;line-height:1.45}
body{padding-bottom:calc(90px + env(safe-area-inset-bottom));-webkit-user-select:none;user-select:none}
header{position:sticky;top:0;z-index:5;background:rgba(20,22,27,.96);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 22px 10px;border-bottom:1px solid var(--line)}
header h1{font-size:22px;margin:0;font-weight:700}
header h1 span{color:var(--acc)}
main{max-width:1180px;margin:0 auto;padding:18px 22px}
section.view{display:none}section.view.on{display:block}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0f1114;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:10px 4px 12px;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit}
nav button .ic{font-size:26px;line-height:1}
nav button.on{color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:16px}
h2{font-size:26px;margin:2px 0 12px}h3{font-size:19px;margin:20px 0 10px;color:var(--acc2)}
p{margin:8px 0}
.btn{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:11px 18px;font-size:17px;min-height:48px;cursor:pointer;font-family:inherit}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);color:#1a1300;border-color:var(--acc);font-weight:700}
.btn.big{font-size:22px;padding:14px 30px;min-height:64px;border-radius:16px}
.btn.huge{font-size:28px;min-height:84px;padding:16px 40px;border-radius:20px}
.btn.sel{background:var(--acc);color:#1a1300;border-color:var(--acc);font-weight:600}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#06210d;font-weight:700}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#2a0606;font-weight:700}
.btn.sm{min-height:40px;padding:8px 12px;font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.lbl{color:var(--mut);font-size:15px;min-width:120px}
.mut{color:var(--mut)}
.quote{border-left:4px solid var(--acc);padding:10px 16px;margin:10px 0;background:#2a2414;border-radius:0 12px 12px 0;font-style:italic}
.quote b{font-style:normal;color:var(--acc2)}
table{border-collapse:collapse;width:100%;margin:8px 0;font-size:17px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:center}
th{background:var(--card2);color:var(--acc2);font-weight:600}
td.l,th.l{text-align:left}
.diagrams{display:flex;flex-wrap:wrap;gap:12px}
.dg{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 8px 6px;text-align:center;cursor:pointer}
.dg .t{font-size:15px;font-weight:700}.dg .s{font-size:13px;color:var(--mut)}
.dg svg{display:block;margin:2px auto}
.gridrow{display:flex;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.gridrow .rh{width:130px;font-weight:700;color:var(--acc2)}
.lesson-h{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.badge{display:inline-block;background:var(--acc);color:#1a1300;font-weight:800;border-radius:10px;padding:2px 10px;margin-right:10px;font-size:16px}
.exlist{display:flex;flex-direction:column;gap:8px}
.exitem{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card2);border-radius:12px;padding:10px 14px}
.exitem .d{font-size:15px;color:var(--mut)}
textarea{width:100%;min-height:90px;background:#121419;color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:17px;font-family:inherit;-webkit-user-select:text;user-select:text}
select{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:17px;min-height:48px;font-family:inherit;max-width:100%}
/* práctica */
.pr-top{display:flex;gap:18px;flex-wrap:wrap}
.pr-chords{flex:1 1 520px;display:flex;gap:18px;align-items:flex-end;justify-content:center;min-height:330px}
.pr-cur,.pr-next{text-align:center}
.pr-cur .name{font-size:40px;font-weight:800}.pr-cur .sub{color:var(--mut);font-size:17px}
.pr-next{opacity:.55}.pr-next .name{font-size:22px;font-weight:700}
.pr-ctrl{flex:1 1 380px}
.bpm{display:flex;align-items:center;gap:10px;justify-content:center;margin:6px 0}
.bpm .v{font-size:64px;font-weight:800;min-width:150px;text-align:center;font-variant-numeric:tabular-nums}
.bpm .u{font-size:16px;color:var(--mut);margin-top:-6px;text-align:center}
input[type=range]{width:100%;height:40px;accent-color:var(--acc)}
.beats{display:flex;gap:12px;justify-content:center;margin:14px 0}
.beat{width:84px;height:84px;border-radius:18px;border:3px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;color:var(--mut);cursor:pointer;background:#16191f}
.beat.play{border-color:var(--acc);color:var(--acc2)}
.beat.rest{border-style:dashed}
.beat.now.play{background:var(--acc);color:#1a1300}
.beat.now.rest{background:#3a3f4b;color:#fff}
.countin{font-size:22px;color:var(--acc2);text-align:center;min-height:32px;font-weight:700}
.loopinfo{text-align:center;color:var(--mut);font-size:16px}
/* tarjetas */
.fc{text-align:center;padding:26px 10px}
.fc .c{font-size:72px;font-weight:800;line-height:1.05}
.fc .i{font-size:34px;font-weight:700;color:var(--acc2)}
.fc .st{font-size:30px;margin-top:6px}
.dots{display:flex;gap:12px;justify-content:center;margin:18px 0}
.dot{width:34px;height:34px;border-radius:50%;border:3px solid var(--acc);}
.dot.on{background:var(--acc)}
.fcres{font-size:22px;margin:8px 0}
/* notas */
.neckwrap{background:#0d0f12;border-radius:14px;padding:10px 6px;border:1px solid var(--line)}
.prompt{font-size:30px;text-align:center;margin:10px 0 14px;min-height:44px}
.prompt b{color:var(--acc)}
.answers{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.answers .btn{min-width:110px;font-size:24px;min-height:70px;font-weight:700}
.stats{display:flex;gap:14px;flex-wrap:wrap}
.stat{background:var(--card2);border-radius:12px;padding:10px 16px;min-width:130px}
.stat .n{font-size:30px;font-weight:800}.stat .k{font-size:14px;color:var(--mut)}
.bars{display:flex;gap:6px;align-items:flex-end;height:150px;padding-top:10px}
.bars .b{flex:1;background:var(--acc);border-radius:6px 6px 0 0;min-height:2px;position:relative}
.bars .b span{position:absolute;bottom:-22px;left:0;right:0;text-align:center;font-size:12px;color:var(--mut)}
.bars .b em{position:absolute;top:-20px;left:0;right:0;text-align:center;font-size:12px;font-style:normal}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--acc);color:#1a1300;padding:12px 22px;border-radius:14px;font-weight:700;opacity:0;transition:opacity .25s;z-index:20;pointer-events:none}
.toast.on{opacity:1}
.hint{font-size:15px;color:var(--mut)}
</style>
</head>
<body>
<header>
  <h1>🎸 Práctica con <span>Espinosa</span></h1>
  <div class="row">
    <span class="mut" style="font-size:15px">Notas:</span>
    <button class="btn sm" id="nameToggle">Do Re Mi</button>
  </div>
</header>

<main>
  <section class="view" id="v-clases"></section>
  <section class="view" id="v-practica"></section>
  <section class="view" id="v-triadas"></section>
  <section class="view" id="v-tarjetas"></section>
  <section class="view" id="v-notas"></section>
  <section class="view" id="v-teoria"></section>
  <section class="view" id="v-progreso"></section>
</main>

<nav id="nav">
  <button data-v="clases"><span class="ic">📒</span>Clases</button>
  <button data-v="practica"><span class="ic">⏱️</span>Práctica</button>
  <button data-v="triadas"><span class="ic">🎼</span>Tríadas</button>
  <button data-v="tarjetas"><span class="ic">🃏</span>Tarjetas</button>
  <button data-v="notas"><span class="ic">🎯</span>Notas</button>
  <button data-v="teoria"><span class="ic">🧮</span>Teoría</button>
  <button data-v="progreso"><span class="ic">📈</span>Progreso</button>
</nav>
<div class="toast" id="toast"></div>

<script>
"use strict";
var OPEN = [0,64,59,55,50,45,40]; // midi de cada cuerda al aire (índice = nº de cuerda)
var PC = {C:0,D:2,E:4,F:5,G:7,A:9,B:11};
/* =====================================================================
   DATOS DE LAS CLASES  —  aquí se añade cada semana el contenido nuevo
   ===================================================================== */

// Posiciones de tríadas. frets: de la cuerda más grave a la más aguda del grupo.
// inv: 'F' fundamental, '1' 1ª inversión, '2' 2ª inversión
const VOICINGS = [
  // ---- DO ----
  {c:'C',inv:'F',set:'321',frets:[5,5,3]},
  {c:'C',inv:'1',set:'321',frets:[9,8,8]},
  {c:'C',inv:'2',set:'321',frets:[12,13,12]},
  {c:'C',inv:'2',set:'432',frets:[5,5,5]},
  {c:'C',inv:'F',set:'432',frets:[10,9,8]},
  {c:'C',inv:'1',set:'432',frets:[14,12,13]},
  {c:'C',inv:'1',set:'543',frets:[7,5,5]},
  {c:'C',inv:'2',set:'543',frets:[10,10,9]},
  {c:'C',inv:'F',set:'543',frets:[15,14,12]},
  {c:'C',inv:'F',set:'654',frets:[8,7,5]},
  {c:'C',inv:'1',set:'654',frets:[12,10,10]},
  {c:'C',inv:'2',set:'654',frets:[15,15,14]},
  // ---- FA ----
  {c:'F',inv:'2',set:'321',frets:[5,6,5]},
  {c:'F',inv:'F',set:'321',frets:[10,10,8]},
  {c:'F',inv:'1',set:'321',frets:[14,13,13]},
  {c:'F',inv:'1',set:'432',frets:[7,5,6]},
  {c:'F',inv:'2',set:'432',frets:[10,10,10]},
  {c:'F',inv:'F',set:'432',frets:[15,14,13]},
  {c:'F',inv:'F',set:'543',frets:[8,7,5]},
  {c:'F',inv:'1',set:'543',frets:[12,10,10]},
  {c:'F',inv:'2',set:'543',frets:[15,15,14]},
  {c:'F',inv:'2',set:'654',frets:[8,8,7]},
  {c:'F',inv:'F',set:'654',frets:[13,12,10]},
  {c:'F',inv:'1',set:'654',frets:[17,15,15]},
  // ---- SOL ----
  {c:'G',inv:'1',set:'321',frets:[4,3,3]},
  {c:'G',inv:'2',set:'321',frets:[7,8,7]},
  {c:'G',inv:'F',set:'321',frets:[12,12,10]},
  {c:'G',inv:'F',set:'432',frets:[5,4,3]},
  {c:'G',inv:'1',set:'432',frets:[9,7,8]},
  {c:'G',inv:'2',set:'432',frets:[12,12,12]},
  {c:'G',inv:'2',set:'543',frets:[5,5,4]},
  {c:'G',inv:'F',set:'543',frets:[10,9,7]},
  {c:'G',inv:'1',set:'543',frets:[14,12,12]},
  {c:'G',inv:'1',set:'654',frets:[7,5,5]},
  {c:'G',inv:'2',set:'654',frets:[10,10,9]},
  {c:'G',inv:'F',set:'654',frets:[15,14,12]}
];

const SETS = ['321','432','543','654'];
const SET_NAME = {'321':'cuerdas 3‑2‑1','432':'cuerdas 4‑3‑2','543':'cuerdas 5‑4‑3','654':'cuerdas 6‑5‑4'};
const INV_NAME = {'F':'Fundamental','1':'1ª inversión','2':'2ª inversión'};
const INV_SHORT = {'F':'Fund.','1':'1ª inv','2':'2ª inv'};
const FIGURE_321 = {'F':'“L”','1':'“12:20”','2':'“Triángulo”'};
const NEXT_DOWN = {'F':'2','2':'1','1':'F'}; // al bajar una cuerda la inversión cambia así

function vid(c,inv,set){return c+'-'+inv+'-'+set;}
const VMAP = {};
VOICINGS.forEach(function(v){v.id=vid(v.c,v.inv,v.set);v.strings=v.set.split('').map(Number);VMAP[v.id]=v;});

// ---------- Ejercicios ----------
const EXERCISES = {};
function addEx(id,lesson,title,desc,steps,opts){
  opts=opts||{};
  EXERCISES[id]={id:id,lesson:lesson,title:title,desc:desc,
    steps:steps.map(function(s){return typeof s==='string'?{v:s,bars:opts.bars||1}:s;}),
    pattern:opts.pattern||[1,1,1,1],style:opts.style||'rasgueo',bpm:opts.bpm||60};
}
function cfcg(set,ids){return ids;}
const Z1=['C-F-321','F-2-321','C-F-321','G-1-321'];
const Z2=['C-1-321','F-F-321','C-1-321','G-2-321'];
const Z3=['C-2-321','F-1-321','C-2-321','G-F-321'];
const LOWZONE = { // Do–Fa–Sol entre los trastes 3 y 8 en cada grupo
  '321':{C:'C-F-321',F:'F-2-321',G:'G-1-321'},
  '432':{C:'C-2-432',F:'F-1-432',G:'G-F-432'},
  '543':{C:'C-1-543',F:'F-F-543',G:'G-2-543'},
  '654':{C:'C-F-654',F:'F-2-654',G:'G-1-654'}
};

// Clase 1
addEx('c1-pos-C','c1','Do en sus 3 posiciones','Sube y baja: Fund (5) → 1ª inv (8) → 2ª inv (12) → 1ª inv',['C-F-321','C-1-321','C-2-321','C-1-321'],{bars:2});
addEx('c1-pos-F','c1','Fa en sus 3 posiciones','2ª inv (5) → Fund (8) → 1ª inv (13) → Fund',['F-2-321','F-F-321','F-1-321','F-F-321'],{bars:2});
addEx('c1-pos-G','c1','Sol en sus 3 posiciones','1ª inv (3) → 2ª inv (7) → Fund (10) → 2ª inv',['G-1-321','G-2-321','G-F-321','G-2-321'],{bars:2});
addEx('c1-z1','c1','Do–Fa–Do–Sol · Zona 1','Trastes 3–6, sin desplazar la mano. Prueba con 1, 2 y 4 golpes por compás.',Z1,{pattern:[1,0,0,0]});
addEx('c1-z2','c1','Do–Fa–Do–Sol · Zona 2','Trastes 7–10, sin desplazar la mano.',Z2,{pattern:[1,0,0,0]});
addEx('c1-z3','c1','Do–Fa–Do–Sol · Zona 3','Trastes 10–14, sin desplazar la mano.',Z3,{pattern:[1,0,0,0]});
addEx('c1-zonas','c1','Zonas 1 → 2 → 3 seguidas','La progresión completa en cada zona, subiendo por el mástil.',Z1.concat(Z2,Z3),{pattern:[1,0,1,0]});
addEx('c1-arp','c1','Zonas 1 → 2 → 3 arpegiado','Como prefiere Espinosa: nota a nota (3‑2‑1‑2).',Z1.concat(Z2,Z3),{style:'arpegio'});

// Clase 2
addEx('c2-ritA','c2','Patrón A con Do–Fa','Toca en 1, 2 y 3; silencio en el 4.',['C-F-321','F-2-321'],{pattern:[1,1,1,0],bars:2});
addEx('c2-ritB','c2','Patrón B con Do–Fa','Toca en 1; silencio en 2; toca en 3 y 4.',['C-F-321','F-2-321'],{pattern:[1,0,1,1],bars:2});
addEx('c2-dograves','c2','Do bajando a las cuerdas graves','Mueve una nota cada vez: 5‑5‑3 → 5‑5‑5 → 7‑5‑5 → 8‑7‑5 y vuelve.',['C-F-321','C-2-432','C-1-543','C-F-654','C-1-543','C-2-432'],{bars:2});
addEx('c2-born1','c2','Born in the U.S.A. (I–IV) · Zona 1','Do → Fa en los trastes 3–6.',[{v:'C-F-321',bars:2},{v:'F-2-321',bars:2}],{pattern:[1,1,1,1]});
addEx('c2-born2','c2','Born in the U.S.A. (I–IV) · Zona 2','Do → Fa en los trastes 7–10.',[{v:'C-1-321',bars:2},{v:'F-F-321',bars:2}]);
addEx('c2-born3','c2','Born in the U.S.A. (I–IV) · Zona 3','Do → Fa en los trastes 12–14.',[{v:'C-2-321',bars:2},{v:'F-1-321',bars:2}]);
addEx('c2-bornarp','c2','Born in the U.S.A. · zonas arpegiado','I–IV recorriendo las 3 zonas, nota a nota.',['C-F-321','F-2-321','C-1-321','F-F-321','C-2-321','F-1-321'],{style:'arpegio',bars:2});
// Cascadas (9)
['C','F','G'].forEach(function(c){
  ['F','1','2'].forEach(function(inv){
    var ids=[],i=inv;
    SETS.forEach(function(s){ids.push(vid(c,i,s)); i=NEXT_DOWN[i];});
    var seq=ids.concat([ids[2],ids[1]]);
    addEx('c2-cas-'+c+'-'+inv,'c2','Cascada · '+c+' desde '+INV_SHORT[inv],'Baja de 3‑2‑1 a 6‑5‑4 moviendo una nota cada vez, y vuelve.',seq,{bars:2,cascade:true});
  });
});
SETS.forEach(function(s){
  var z=LOWZONE[s];
  addEx('c2-grp-'+s,'c2','Do–Fa–Do–Sol en '+SET_NAME[s],'Todo entre los trastes 3 y 8.',[z.C,z.F,z.C,z.G],{pattern:[1,0,1,0]});
});
addEx('c2-grp-all','c2','Do–Fa–Do–Sol por los 4 grupos','3‑2‑1 → 4‑3‑2 → 5‑4‑3 → 6‑5‑4, siempre en los trastes 3–8.',
  [].concat.apply([],SETS.map(function(s){var z=LOWZONE[s];return [z.C,z.F,z.C,z.G];})),{pattern:[1,0,1,0]});
addEx('c2-silencio','c2','Cambia en el silencio','Patrón A: el tiempo 4 en silencio es tu momento para cambiar de acorde.',
  [].concat.apply([],SETS.map(function(s){var z=LOWZONE[s];return [z.C,z.F,z.C,z.G];})),{pattern:[1,1,1,0]});
addEx('c2-borngrp','c2','Born in the U.S.A. por los 4 grupos','Do → Fa en cada grupo de cuerdas, trastes 3–8.',
  [].concat.apply([],SETS.map(function(s){var z=LOWZONE[s];return [{v:z.C,bars:2},{v:z.F,bars:2}];})));

// ---------- Ejercicios melódicos (nota a nota / dobles cuerdas) ----------
function addMel(id,lesson,title,desc,events,opts){
  opts=opts||{};
  EXERCISES[id]={id:id,lesson:lesson,title:title,desc:desc,type:'mel',steps:events,pattern:[1,1,1,1],style:'mel',bpm:opts.bpm||60,npb:opts.npb||1,pick:!!opts.pick};
}
function N(s,f,l){return {n:[[s,f]],l:l||''};}
function D(a,b,l){return {n:[a,b],l:l||''};}
// Clase 3 · cromatismo (Do grave 6ª/8 → Do agudo 1ª/8)
var CROM_START={6:8,5:7,4:6,3:5,2:5,1:4};
var CROM=[];[6,5,4,3,2,1].forEach(function(s){for(var k=0;k<4;k++)CROM.push(N(s,CROM_START[s]+k,'dedo '+(k+1)));});CROM.push(N(1,8,'dedo 4'));
addMel('c3-crom','c3','Cromatismo: Do grave → Do agudo','Desde el traste 8 de la 6ª: 4 notas por cuerda, un dedo por traste. Púa alterna estricta (↓↑).',CROM,{pick:true,npb:2});
addMel('c3-crom2','c3','Cromatismo ida y vuelta','Sube hasta el Do agudo y vuelve a bajar sin romper la púa alterna.',CROM.concat(CROM.slice(1,-1).reverse()),{pick:true,npb:2});
// Clase 3 · notas vecinas (superior diatónica + sensible inferior → nota)
var CMAJ=[0,2,4,5,7,9,11];
function upperDiat(pc){for(var d=1;d<=2;d++)if(CMAJ.indexOf((pc+d)%12)>=0)return d;return 2;}
function enclosure(id){var v=VMAP[id],ev=[];for(var i=0;i<3;i++){var s=v.strings[i],f=v.frets[i],pc=pcAt(s,f);ev.push(N(s,f+upperDiat(pc),'superior'));ev.push(N(s,f-1,'sensible'));ev.push(N(s,f,'nota del acorde'));}return ev;}
addMel('c3-vec1','c3','Notas vecinas · {C} Zona 1 (5‑5‑3)','Sobre cada nota del acorde: superior → sensible → nota. En tresillos.',enclosure('C-F-321'),{npb:3});

const LAT = ['Do','Do♯','Re','Re♯','Mi','Fa','Fa♯','Sol','Sol♯','La','La♯','Si'];
const AME = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const NATURAL = [0,2,4,5,7,9,11];

function load(k,d){try{var s=localStorage.getItem('esp_'+k);return s?JSON.parse(s):d;}catch(e){return d;}}
function save(k,v){try{localStorage.setItem('esp_'+k,JSON.stringify(v));}catch(e){}}
var SET = load('settings',{latin:true});
function nn(pc){return (SET.latin?LAT:AME)[((pc%12)+12)%12];}
function chordName(c){return nn(PC[c]);}
function pcAt(s,f){return (OPEN[s]+f)%12;}
function $(id){return document.getElementById(id);}
function el(tag,attrs,html){var e=document.createElement(tag);if(attrs)for(var k in attrs){if(k==='cls')e.className=attrs[k];else e.setAttribute(k,attrs[k]);}if(html!=null)e.innerHTML=html;return e;}
function fill(str){ // sustituye {C} {F} {G} (acordes) y {nX} (notas) según la notación elegida
  return str.replace(/\{n([A-G])\}/g,function(m,a){return nn(PC[a]);}).replace(/\{([A-G])\}/g,function(m,a){return chordName(a);});
}
function toast(msg){var t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('on');},1800);}
function vLabel(v){return chordName(v.c)+' · '+INV_SHORT[v.inv];}
function degreeOf(v,i){var d=(pcAt(v.strings[i],v.frets[i])-PC[v.c]+12)%12;return d===0?'R':d===4?'3':d===7?'5':'?';}
function fretsTxt(v){return v.frets.join('‑');}

/* =====================================================================
   DIAGRAMA DE ACORDE (vertical, como la hoja de Espinosa)
   ===================================================================== */
function diagramSVG(v,o){
  o=o||{};
  var w=o.w||150, names=!!o.names, hl=(o.hl==null?-1:o.hl);
  var mn=Math.min.apply(null,v.frets), mx=Math.max.apply(null,v.frets);
  var start=Math.max(1,mn-1), nF=5;
  if(mx>start+nF-1) start=mx-nF+1;
  var padL=w*0.2, padR=w*0.08, padT=w*0.08, padB=w*0.06;
  var gw=w-padL-padR, colW=gw/5, rowH=colW*1.18;
  var h=padT+rowH*nF+padB;
  var s='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h.toFixed(0)+'" viewBox="0 0 '+w+' '+h.toFixed(1)+'">';
  s+='<rect x="'+padL+'" y="'+padT+'" width="'+gw+'" height="'+(rowH*nF)+'" fill="#fff3a3"/>';
  // inlays
  for(var r=0;r<nF;r++){
    var fr=start+r, cy=padT+rowH*(r+0.5);
    if([3,5,7,9,15,17,19].indexOf(fr)>=0) s+='<circle cx="'+(padL+colW*2.5)+'" cy="'+cy+'" r="'+(colW*0.16)+'" fill="#bdbdbd"/>';
    if(fr===12){s+='<circle cx="'+(padL+colW*1.5)+'" cy="'+cy+'" r="'+(colW*0.16)+'" fill="#bdbdbd"/><circle cx="'+(padL+colW*3.5)+'" cy="'+cy+'" r="'+(colW*0.16)+'" fill="#bdbdbd"/>';}
    var bold=[3,5,7,9,12,15,17].indexOf(fr)>=0;
    s+='<text x="'+(padL-6)+'" y="'+(cy+5)+'" text-anchor="end" font-size="'+(w*0.1)+'" fill="'+(bold?'#ffd76a':'#8a93a3')+'" font-weight="'+(bold?'700':'400')+'">'+fr+'</text>';
  }
  for(var i=0;i<=nF;i++){var y=padT+rowH*i;s+='<line x1="'+padL+'" y1="'+y+'" x2="'+(padL+gw)+'" y2="'+y+'" stroke="#7a7a7a" stroke-width="'+(i===0&&start===1?5:1.6)+'"/>';}
  for(var c=0;c<6;c++){var x=padL+colW*c;s+='<line x1="'+x+'" y1="'+padT+'" x2="'+x+'" y2="'+(padT+rowH*nF)+'" stroke="#333" stroke-width="'+(1+ (5-c)*0.25)+'"/>';}
  // notas
  for(var k=0;k<3;k++){
    var str=v.strings[k], f=v.frets[k];
    var cx=padL+colW*(6-str), cy2=padT+rowH*(f-start+0.5), rr=colW*0.42;
    var deg=degreeOf(v,k), isR=deg==='R';
    if(k===hl) s+='<circle cx="'+cx+'" cy="'+cy2+'" r="'+(rr*1.55)+'" fill="none" stroke="#3fb950" stroke-width="'+(colW*0.18)+'"/>';
    s+='<circle cx="'+cx+'" cy="'+cy2+'" r="'+rr+'" fill="'+(isR?'#e5484d':'#ffffff')+'" stroke="#222" stroke-width="1.5"/>';
    var lab=names?nn(pcAt(str,f)):deg;
    var fs=(lab.length>2?colW*0.36:colW*0.5);
    s+='<text x="'+cx+'" y="'+(cy2+fs*0.36)+'" text-anchor="middle" font-size="'+fs.toFixed(1)+'" font-weight="700" fill="'+(isR?'#fff':'#222')+'">'+lab+'</text>';
  }
  s+='</svg>';
  return s;
}

   AUDIO (metrónomo + sonido de guitarra sintetizado)
   ===================================================================== */
var actx=null, master=null;
function ensureAudio(){
  if(!actx){
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return null;
    actx=new AC(); master=actx.createGain(); master.gain.value=0.9; master.connect(actx.destination);
    var b=actx.createBuffer(1,1,22050), src=actx.createBufferSource(); src.buffer=b; src.connect(actx.destination); src.start(0);
  }
  if(actx.state==='suspended') actx.resume();
  return actx;
}
document.addEventListener('touchstart',ensureAudio,{passive:true,once:true});
document.addEventListener('mousedown',ensureAudio,{once:true});

function clickAt(t,kind){
  var o=actx.createOscillator(), g=actx.createGain();
  var f=kind==='acc'?1700:kind==='rest'?750:1150, vol=kind==='acc'?0.55:kind==='rest'?0.16:0.38;
  if(kind==='count'){f=1400;vol=0.45;}
  o.type='sine'; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.002); g.gain.exponentialRampToValueAtTime(0.0001,t+0.045);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+0.06);
}
function pluck(midi,t,dur,vol){
  dur=dur||1.6; vol=vol||0.22;
  var f=440*Math.pow(2,(midi-69)/12);
  var o=actx.createOscillator(), o2=actx.createOscillator(), g=actx.createGain(), g2=actx.createGain(), lp=actx.createBiquadFilter();
  o.type='sawtooth'; o.frequency.value=f; o2.type='triangle'; o2.frequency.value=f*2.003; g2.gain.value=0.35;
  lp.type='lowpass'; lp.Q.value=1; lp.frequency.setValueAtTime(Math.min(9000,f*9),t); lp.frequency.exponentialRampToValueAtTime(Math.max(250,f*1.4),t+dur*0.7);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.004); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(lp); o2.connect(g2); g2.connect(lp); lp.connect(g); g.connect(master);
  o.start(t); o2.start(t); o.stop(t+dur+0.05); o2.stop(t+dur+0.05);
}
function midiOf(v,i){return OPEN[v.strings[i]]+v.frets[i];}
function playVoicing(v){
  if(!ensureAudio()) return;
  var t=actx.currentTime+0.03;
  for(var i=0;i<3;i++) pluck(midiOf(v,i),t+i*0.28,1.4,0.2);
  for(var j=0;j<3;j++) pluck(midiOf(v,j),t+1.0+j*0.025,1.8,0.17);
}

  for(var st=1;st<=6;st++){var y=NECK.y0+(st-1)*NECK.sh;s+='<line x1="'+(NECK.x0-6)+'" y1="'+y+'" x2="'+W+'" y2="'+y+'" stroke="#444" stroke-width="'+(1+st*0.45)+'"/><text x="12" y="'+(y+6)+'" font-size="17" font-weight="700" fill="#eee">'+st+'</text>';}

function dotSVG(s,f,r,fill,stroke,label,tc){

}
function melNeckSVG(steps,idx){
  var s=neckBase(), seen={};
  steps.forEach(function(e){e.n.forEach(function(p){var k=p[0]+'-'+p[1];if(seen[k])return;seen[k]=1;s+=dotSVG(p[0],p[1],13,'#ffffff','#999',nn(pcAt(p[0],p[1])),'#555');});});
  var nx=steps[(idx+1)%steps.length];
  nx.n.forEach(function(p){s+=dotSVG(p[0],p[1],16,'#ffffff','#5aa9ff',nn(pcAt(p[0],p[1])),'#1d4f8a');});
  steps[idx].n.forEach(function(p){s+=dotSVG(p[0],p[1],19,'#3fb950','#0b3d17',nn(pcAt(p[0],p[1])),'#fff');});

function tpb(){return (M.style==='arpegio'||M.style==='mel')?M.subdiv:1;}
function startMetro(){
  if(!ensureAudio()){toast('Este navegador no permite audio');return;}
  M.running=true; M.tick=0; M.step=0; M.bar=0; M.loops=0; M.queue=[];
  M.countLeft=M.ex?4:0;
  M.nextTime=actx.currentTime+0.12;
  M.timer=setInterval(scheduler,25);
  keepAwake(true);
  $('playBtn').textContent='■ Parar'; $('playBtn').classList.remove('pri'); $('playBtn').classList.add('bad');
  requestAnimationFrame(drawLoop);
}
function stopMetro(){
  M.running=false; clearInterval(M.timer); keepAwake(false);
  if($('playBtn')){$('playBtn').textContent='▶ Empezar';$('playBtn').classList.add('pri');$('playBtn').classList.remove('bad');}
  for(var i=0;i<4;i++){var b=$('beat'+i);if(b)b.classList.remove('now');}
  if($('countin'))$('countin').textContent='';
  M.step=0;M.bar=0;renderChords(true);
}
function scheduler(){
  while(M.nextTime<actx.currentTime+0.12){
    var t=M.nextTime;
    if(M.countLeft>0){
      if(M.click||true) clickAt(t,M.countLeft===4?'acc':'count');
      M.queue.push({t:t,count:5-M.countLeft,step:0,beat:-1});
      M.countLeft--; M.nextTime+=60/M.bpm; continue;
    }
    var T=tpb(), beat=Math.floor(M.tick/T)%4, sub=M.tick%T;
    var hl=-1;
    if(M.ex&&M.ex.type==='mel'){
      if(sub===0&&M.click) clickAt(t,beat===0?'acc':'beat');
      var e=M.ex.steps[M.step];
      if(M.guide) e.n.forEach(function(p){pluck(OPEN[p[0]]+p[1],t,0.8,0.2);});
      M.queue.push({t:t,beat:sub===0?beat:-2,step:M.step,hl:-1,loops:M.loops,bar:0});
      M.tick++; M.nextTime+=60/M.bpm/T; M.step++;
      if(M.step>=M.ex.steps.length){M.step=0;M.loops++;}
      continue;
    }
    if(sub===0&&M.click) clickAt(t,beat===0?'acc':(M.pattern[beat]?'beat':'rest'));
    var v=M.ex?VMAP[M.ex.steps[M.step].v]:null;
    if(v&&M.pattern[beat]){
      if(M.style==='arpegio'){hl=ARP_ORDER[(beat*T+sub)%4];if(M.guide)pluck(midiOf(v,hl),t,1.0,0.2);}
      else if(sub===0&&M.guide){for(var j=0;j<3;j++)pluck(midiOf(v,j),t+j*0.02,0.9,0.15);}
    }
    M.queue.push({t:t,beat:sub===0?beat:-2,step:M.step,hl:hl,loops:M.loops,bar:M.bar});
    M.tick++; M.nextTime+=60/M.bpm/T;
    if(M.tick%(4*T)===0&&M.ex){
      M.bar++;
      if(M.bar>=M.ex.steps[M.step].bars){M.bar=0;M.step++;if(M.step>=M.ex.steps.length){M.step=0;M.loops++;}}
    }
  }
}
function drawLoop(){
  if(!M.running) return;
  var now=actx.currentTime, last=null;
  while(M.queue.length&&M.queue[0].t<=now){last=M.queue.shift();applyVisual(last);}
  requestAnimationFrame(drawLoop);
}
function applyVisual(q){
  if(current!=='practica') return;
  if(q.count){$('countin').textContent='Preparado… '+q.count;flashBeat(q.count-1,true);return;}
  $('countin').textContent='';
  if(q.beat>=0) flashBeat(q.beat,false);
  if(M.ex){
    var steps=M.ex.steps;
    var stepTxt=(M.ex.type==='mel'?'Nota ':'Acorde ')+(q.step+1)+' de '+steps.length+(steps[q.step].bars>1?' · compás '+(q.bar+1)+'/'+steps[q.step].bars:'')+' · vuelta '+(q.loops+1);
    $('loopinfo').textContent=stepTxt;
    var saveStep=M.step; M.step=q.step; renderChords(false,M.style==='arpegio'?q.hl:null); M.step=saveStep;
  }
}

  for(var i=0;i<4;i++){var e=$('beat'+i);if(e)e.classList.toggle('now',i===b);}

}

function renderQuiz(root){
  var c=el('div',{cls:'card'});
  var r=el('div',{cls:'row'}); r.appendChild(el('span',{cls:'lbl'},'Tipo'));
  [['grado','¿Qué nota es?'],['acorde','¿Qué acorde es?'],['porque','¿Por qué la alteración?'],['construye','Construye la escala']].forEach(function(o){var b=el('button',{cls:'btn sm'+(TQ.kind===o[0]||(!TQ.kind&&o[0]==='grado')?' sel':'')},o[1]);b.addEventListener('click',function(){newTQ(o[0]);});r.appendChild(b);});
  c.appendChild(r);
  var r2=el('div',{cls:'row',style:'margin-top:8px'}); r2.appendChild(el('span',{cls:'lbl'},'Escalas'));
  [['easy','Fáciles ('+EASY.map(function(k){return spell({l:k[0],a:0});}).join(', ')+')'],['all','Las 12']].forEach(function(o){var b=el('button',{cls:'btn sm'+(TH.pool===o[0]?' sel':'')},o[1]);b.addEventListener('click',function(){TH.pool=o[0];save('thCfg',TH);newTQ();});r2.appendChild(b);});
  var s=load('thStats',{n:0,ok:0});
  r2.appendChild(el('span',{cls:'mut',style:'margin-left:auto'},'Sesión: '+TQ.score.ok+'/'+TQ.score.n+' · total '+s.ok+'/'+s.n));
  c.appendChild(r2); root.appendChild(c);
  if(!TQ.q){newTQ('grado');return;}
  var q=TQ.q, sc=q.sc, ton=spell(sc[0]), g=el('div',{cls:'card'});
  var ans=el('div',{cls:'answers',style:'margin-top:14px'});
  if(TQ.kind==='grado'){
    g.appendChild(el('div',{cls:'prompt'},'¿Cuál es la <b>'+(q.i+1)+'ª</b> nota de la escala de <b>'+ton+' mayor</b>?'));
    q.opts.forEach(function(n){var b=el('button',{cls:'btn'},spell(n));b.addEventListener('click',function(){if(TQ.done)return;var ok=n.pc===sc[q.i].pc;tqResult(ok,'La '+(q.i+1)+'ª de '+ton+' mayor es <b>'+spell(sc[q.i])+'</b>: '+sc.slice(0,q.i+1).map(spell).join(' → ')+'.');});ans.appendChild(b);});
  } else if(TQ.kind==='acorde'){
    g.appendChild(el('div',{cls:'prompt'},'En <b>'+ton+' mayor</b>, ¿qué acorde se forma sobre el grado <b>'+ROMAN[q.i]+'</b> ('+spell(sc[q.i])+')?'));
    ['Mayor','menor','disminuido'].forEach(function(o){var b=el('button',{cls:'btn',style:'min-width:170px'},o);b.addEventListener('click',function(){if(TQ.done)return;var T=q.T;tqResult(o===T.q,'<b>'+T.sym+'</b> = '+spell(T.r)+' – '+spell(T.t)+' – '+spell(T.f)+'. '+thirdTxt(T.ti)+' y '+fifthTxt(T.fi)+' → <b>'+T.q+'</b>.');playNotes([T.r.pc,T.t.pc,T.f.pc],true);});ans.appendChild(b);});
  } else if(TQ.kind==='porque'){
    var n=sc[q.i];
    g.appendChild(el('div',{cls:'prompt'},'¿Por qué la escala de <b>'+ton+' mayor</b> lleva <b>'+spell(n)+'</b> en lugar de '+spell({l:n.l,a:0})+'?'));
    ans.style.flexDirection='column';
    q.opts.forEach(function(o){var b=el('button',{cls:'btn',style:'text-align:left;font-size:19px;font-weight:500'},o.t);b.addEventListener('click',function(){if(TQ.done)return;tqResult(o.ok,whyAlt(sc,q.i));});ans.appendChild(b);});
  } else {
    var nI=q.built.length;
    g.appendChild(el('div',{cls:'prompt'},'Construye <b>'+ton+' mayor</b> nota a nota'));
    g.appendChild(el('div',{style:'text-align:center;font-size:30px;font-weight:800;margin-bottom:6px'},q.built.map(spell).join(' · ')+(nI<8?' · <span class="mut">?</span>':'')));
    if(nI<8){
      var prev=q.built[nI-1];
      if(q.stage==='int'){
        g.appendChild(el('p',{style:'text-align:center'},'De <b>'+spell(prev)+'</b> (grado '+nI+') a la siguiente, ¿hay tono o semitono?'));
        [[2,'T · tono'],[1,'½ · semitono']].forEach(function(o){var b=el('button',{cls:'btn',style:'min-width:200px'},o[1]);b.addEventListener('click',function(){
          if(o[0]===STEPS[nI-1]){q.stage='note';renderTeoria();}else{q.err++;toast('No: de '+nI+' a '+(nI+1)+' la fórmula pide '+stepTxt(STEPS[nI-1]));}
        });ans.appendChild(b);});
      } else {
        var target=nI===7?sc[0]:sc[nI], L=target.l;
        g.appendChild(el('p',{style:'text-align:center'},'Hay '+stepTxt(STEPS[nI-1])+'. Cada letra sale una sola vez, así que toca <b>'+(SET.latin?LETTER_LAT[L]:L)+'</b>: ¿cuál?'));
        [-1,0,1].forEach(function(a){var cand={l:L,a:a};var b=el('button',{cls:'btn'},spell(cand));b.addEventListener('click',function(){
          var pc=(PC[L]+a+12)%12;
          if(pc===target.pc){q.built.push(nI===7?sc[0]:target);q.stage='int';if(q.built.length===8)tqResult(q.err===0,'Escala completa: '+q.built.map(spell).join(' – ')+(q.err?' ('+q.err+' fallo'+(q.err>1?'s':'')+')':' ¡sin fallos!'));else renderTeoria();}
          else{q.err++;toast('No: de '+spell(prev)+' a '+spell(cand)+' no hay '+stepTxt(STEPS[nI-1]));}
        });ans.appendChild(b);});
      }
    }
  }
  g.appendChild(ans);
  if(TQ.done){
    g.appendChild(el('div',{cls:'quote',style:'font-style:normal;margin-top:16px;font-size:19px'},TQ.msg));
    if(TQ.kind!=='acorde') g.appendChild(el('div',null,stripSVG(sc,TQ.kind==='construye'?-1:q.i)));
    var nb=el('button',{cls:'btn big pri',style:'margin-top:10px'},'Siguiente →');nb.addEventListener('click',function(){newTQ();});g.appendChild(nb);
  }
  root.appendChild(g);
}

/* =====================================================================
   VISTA: PROGRESO
   ===================================================================== */
function todayKey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
var lastTouch=0;
document.addEventListener('pointerdown',function(){lastTouch=Date.now();},true);
document.addEventListener('touchstart',function(){lastTouch=Date.now();},{passive:true,capture:true});
setInterval(function(){
  if(document.visibilityState!=='visible') return;
  if(M.running||Date.now()-lastTouch<60000){var p=load('time',{});var k=todayKey();p[k]=(p[k]||0)+15;save('time',p);}
},15000);
function renderProgreso(){
  var root=$('v-progreso'); root.innerHTML='';
  var t=load('time',{}), days=[], tot=0, streak=0;
  for(var i=13;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);var k=todayKey(d);days.push({k:k,d:d,m:Math.round((t[k]||0)/60)});}
  Object.keys(t).forEach(function(k){tot+=t[k];});
  for(var j=0;j<400;j++){var dd=new Date();dd.setDate(dd.getDate()-j);var kk=todayKey(dd);if((t[kk]||0)>=120)streak++;else if(j>0)break;}
  var mx=Math.max.apply(null,days.map(function(x){return x.m;}).concat([10]));
  var wd=['D','L','M','X','J','V','S'];
  var c1=el('div',{cls:'card'});
  c1.innerHTML='<h2>Mi progreso</h2><div class="stats"><div class="stat"><div class="n">'+days[13].m+' min</div><div class="k">Hoy</div></div><div class="stat"><div class="n">'+days.slice(7).reduce(function(a,b){return a+b.m;},0)+' min</div><div class="k">Últimos 7 días</div></div><div class="stat"><div class="n">'+Math.round(tot/3600*10)/10+' h</div><div class="k">Total</div></div><div class="stat"><div class="n">'+streak+'</div><div class="k">Días seguidos (≥2 min)</div></div></div>'+
    '<h3>Minutos de práctica · últimos 14 días</h3><div class="bars">'+days.map(function(x){return '<div class="b" style="height:'+(100*x.m/mx)+'%"><em>'+(x.m||'')+'</em><span>'+wd[x.d.getDay()]+x.d.getDate()+'</span></div>';}).join('')+'</div><div style="height:26px"></div>'+
    '<p class="hint">Cuenta el tiempo con el metrónomo en marcha o mientras usas la app.</p>';
  root.appendChild(c1);
  var rec=load('records',{}), c2=el('div',{cls:'card'});
  var rows=Object.keys(rec).map(function(k){var E=EXERCISES[k];return '<tr><td class="l">'+(E?fill(exTitle(E)):'Metrónomo libre')+'</td><td><b>'+rec[k]+'</b> BPM</td></tr>';}).join('');
  c2.innerHTML='<h3 style="margin-top:0">Récords de velocidad (limpio)</h3>'+(rows?'<table><tr><th class="l">Ejercicio</th><th>BPM</th></tr>'+rows+'</table>':'<p class="mut">Aún no hay récords. En Práctica, pulsa “✔ Me sale limpio” cuando un tempo te salga bien.</p>');
  root.appendChild(c2);
  var fs=load('fcStats',{}), c3=el('div',{cls:'card'});
  var list=Object.keys(fs).map(function(k){var s=fs[k];return {v:VMAP[k],s:s,rate:s.ok/s.n,ms:s.ms/s.n};}).filter(function(x){return x.v;}).sort(function(a,b){return a.rate-b.rate||b.ms-a.ms;});
  c3.innerHTML='<h3 style="margin-top:0">Tarjetas · posiciones que más te cuestan</h3>'+(list.length?'<table><tr><th class="l">Posición</th><th>Aciertos</th><th>Tiempo medio</th></tr>'+list.slice(0,10).map(function(x){return '<tr><td class="l">'+chordName(x.v.c)+' · '+INV_SHORT[x.v.inv]+' · '+x.v.set.split('').join('‑')+' <span class="mut">('+fretsTxt(x.v)+')</span></td><td>'+x.s.ok+'/'+x.s.n+'</td><td>'+(x.ms/1000).toFixed(1)+' s</td></tr>';}).join('')+'</table>':'<p class="mut">Juega a las Tarjetas para ver aquí tus puntos débiles.</p>');
  root.appendChild(c3);
  var ns=ngStats(), c4=el('div',{cls:'card'});
  c4.innerHTML='<h3 style="margin-top:0">Notas del mástil</h3><p>'+ns.ok+' aciertos de '+ns.n+' · mejor racha '+ns.best+'</p>';
  root.appendChild(c4);
  var c5=el('div',{cls:'card'});
  c5.innerHTML='<h3 style="margin-top:0">Copia de seguridad</h3><p class="mut">Tu progreso se guarda en este iPad (en este navegador). Si borras los datos de Safari, se pierde.</p>';
  var bx=el('button',{cls:'btn'},'Borrar todo el progreso');
  bx.addEventListener('click',function(){if(confirm('¿Seguro que quieres borrar todo tu progreso?')){['time','records','recHist','fcStats','ngStats'].forEach(function(k){try{localStorage.removeItem('esp_'+k);}catch(e){}});renderProgreso();toast('Progreso borrado');}});
  c5.appendChild(bx); root.appendChild(c5);
}

   ARRANQUE
   ===================================================================== */
function renderAll(){
  renderClases(); renderPractica(); renderTriadas(); renderTarjetas(); renderNotas(); renderTeoria();
  if(current==='progreso') renderProgreso();
}
updateNameToggle();
renderAll();
show(load('lastView','clases'));
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&M.running)keepAwake(true);});
</script>
